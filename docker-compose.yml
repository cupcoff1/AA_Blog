services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: aa_blog
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端 ====================
  backend:
    build:
      context: ./AA_Blog_backEnd
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aa_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      UPLOAD_BASE_DIR: /app/uploads/blog/
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # ==================== Nginx（前端 + 反向代理） ====================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./AA_Blog_frontEnd/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
