server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aa_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

upload:
  base-dir: E:/uploads/blog/
  max-size: 2097152  # 2MB

jwt:
  secret: aa_blog_secret_key_2026_abcdefghijklmnop
  ttl: 604800  # 7天 (秒)

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
