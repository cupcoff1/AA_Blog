# AA_Blog Nginx 部署配置
#
# 使用方式（Windows）：
#   1. 下载 nginx：https://nginx.org/en/download.html
#   2. 解压后将此文件覆盖 conf/nginx.conf
#   3. 修改下方 root 路径为实际路径
#   4. 双击 nginx.exe 启动
#   5. 访问 http://localhost
#
# 使用方式（Linux/macOS）：
#   cp nginx.conf /etc/nginx/sites-available/aa_blog
#   ln -s /etc/nginx/sites-available/aa_blog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen       80;
        server_name  localhost;

        # ============================================================
        # 1. 前端静态文件 + SPA 路由
        #    npm run build → dist/ → 填下面 root
        # ============================================================
        location / {
            root   E:/Study/JavaEE/AA_Blog/AA_Blog_frontEnd/dist;
            index  index.html;
            try_files $uri /index.html;  # Vue Router history mode
        }

        # ============================================================
        # 2. 后端 API 转发
        # ============================================================
        location /api/ {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================================
        # 3. 上传文件
        # ============================================================
        location /uploads/ {
            alias E:/Study/JavaEE/AA_Blog/AA_Blog_backEnd/uploads/blog/;
        }
    }
}
